name: Build Notepad Next

on:
  workflow_dispatch: 
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:

env:
  QT_RELEASE_VER: 6.5

jobs:
  build:
    env:
      MACOS_HAS_CODESIGN_SECRETS: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.MACOS_CODESIGN_IDENTITY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ─── Windows ───────────────────────────────────────────────
          - os: windows-2022
            platform: windows
            qt_version: "6.5"
          - os: windows-2022
            platform: windows
            qt_version: "6.8"
          - os: windows-2022
            platform: windows
            qt_version: "6.10"

          # ─── Windows (ARM) ─────────────────────────────────────────
          - os: windows-11-arm
            platform: windows
            qt_version: "6.8"
            qt_arch: win64_msvc2022_arm64
            vs_arch: arm64
            artifact_suffix: -arm64
          - os: windows-11-arm
            platform: windows
            qt_version: "6.10"
            qt_arch: win64_msvc2022_arm64
            vs_arch: arm64
            artifact_suffix: -arm64

          # ─── Linux ─────────────────────────────────────────────────
          - os: ubuntu-24.04
            platform: linux
            qt_version: "6.5"
          - os: ubuntu-24.04
            platform: linux
            qt_version: "6.8"
          - os: ubuntu-24.04
            platform: linux
            qt_version: "6.10"

          # ─── macOS Intel (x64) ─────────────────────────────────────
          - os: macos-15-intel
            platform: mac
            arch: x64
            cmake_arch: x86_64
            qt_arch: clang_64
            qt_version: "6.5"
            deployment_target: "11.0"
          - os: macos-15-intel
            platform: mac
            arch: x64
            cmake_arch: x86_64
            qt_arch: clang_64
            qt_version: "6.8"
            deployment_target: "12.0"
          - os: macos-15-intel
            platform: mac
            arch: x64
            cmake_arch: x86_64
            qt_arch: clang_64
            qt_version: "6.10"
            deployment_target: "13.0"

          # ─── macOS Apple Silicon (arm64) ───────────────────────────
          - os: macos-15
            platform: mac
            arch: arm64
            cmake_arch: arm64
            qt_arch: clang_64
            qt_version: "6.5"
            deployment_target: "12.0"
          - os: macos-15
            platform: mac
            arch: arm64
            cmake_arch: arm64
            qt_arch: clang_64
            qt_version: "6.8"
            deployment_target: "13.0"
          - os: macos-26
            platform: mac
            arch: arm64
            cmake_arch: arm64
            qt_arch: clang_64
            qt_version: "6.10"
            deployment_target: "14.0"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # ─── Install Qt (Windows / Linux via jurplel) ──────────────
      - name: Install Qt
        if: matrix.platform != 'mac'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          modules: 'qt5compat'
          cache: true
          arch: ${{ matrix.qt_arch }}

      # ─── Install Qt (macOS via jdpurcell for arch support) ─────
      - name: Install Qt (mac)
        if: matrix.platform == 'mac'
        uses: jdpurcell/install-qt-action@v5
        with:
          version: ${{ matrix.qt_version }}
          host: mac
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qt5compat
          cache: true

      - name: Setup Visual Studio Tools
        if: matrix.platform == 'windows'
        uses: egor-tensin/vs-shell@v2
        with:
          arch: ${{ matrix.vs_arch || 'x64' }}

      - name: Install NSIS
        if: matrix.platform == 'windows'
        uses: repolevedavaj/install-nsis@v1.3.0
        with:
          nsis-version: '3.11'

      - name: Setup Linux
        if: matrix.platform == 'linux'
        run: |
          echo "DISTRIBUTION=AppImage" >> "$GITHUB_ENV"
          if [[ "${{ matrix.qt_version }}" == "6.10" ]]; then
            echo "EXTRA_PLATFORM_PLUGINS=libqwayland.so" >> "$GITHUB_ENV"
          else
            echo "EXTRA_PLATFORM_PLUGINS=libqwayland-generic.so" >> "$GITHUB_ENV"
          fi
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 fuse libxcb-cursor-dev libcups2-dev

      - name: Set Distribution (mac)
        if: matrix.platform == 'mac'
        shell: bash
        run: echo "DISTRIBUTION=dmg" >> "$GITHUB_ENV"

      - name: Import Code-Signing Certificate (mac)
        if: matrix.platform == 'mac' && env.MACOS_HAS_CODESIGN_SECRETS == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/notepadnext-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode -o "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Configure
        shell: bash
        run: |
          CMAKE_OPTS=(-S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAPP_DISTRIBUTION="${DISTRIBUTION}")
          if [ "${{ matrix.platform }}" = "mac" ]; then
            CMAKE_OPTS+=(-DCMAKE_OSX_ARCHITECTURES="${{ matrix.cmake_arch }}" -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ matrix.deployment_target }}")
            if [ "${{ env.MACOS_HAS_CODESIGN_SECRETS }}" = "true" ]; then
              CMAKE_OPTS+=(-DMACOS_CODESIGN_IDENTITY="${{ secrets.MACOS_CODESIGN_IDENTITY }}")
            fi
          fi
          cmake "${CMAKE_OPTS[@]}"

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Build Windows Targets
        if: matrix.platform == 'windows'
        run: cmake --build build --target package zip installer --parallel

      - name: Build MacOS Targets
        if: matrix.platform == 'mac'
        shell: bash
        run: cmake --build build --target dmg --parallel

      - name: Notarize and Staple DMG (mac)
        if: matrix.platform == 'mac' && env.MACOS_HAS_CODESIGN_SECRETS == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARIZATION_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          DMG_PATH=$(ls build/NotepadNext*.dmg)
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"

      - name: Verify Gatekeeper Acceptance (mac)
        if: matrix.platform == 'mac' && env.MACOS_HAS_CODESIGN_SECRETS == 'true'
        shell: bash
        run: |
          DMG_PATH=$(ls build/NotepadNext*.dmg)
          MOUNT_POINT=$(mktemp -d)
          hdiutil attach "$DMG_PATH" -mountpoint "$MOUNT_POINT" -nobrowse -quiet
          APP_PATH=$(find "$MOUNT_POINT" -maxdepth 1 -name "*.app")

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"

          hdiutil detach "$MOUNT_POINT" -quiet

      - name: Build Linux Targets
        if: matrix.platform == 'linux'
        run: cmake --build build --target appimage --parallel

      - name: Upload Windows zip Package
        uses: actions/upload-artifact@v7
        if: matrix.platform == 'windows'
        with:
          name: NotepadNext-Windows-Qt${{ matrix.qt_version }}${{ matrix.artifact_suffix }}-Zip
          path: ${{ github.workspace }}/build/package/

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v7
        if: matrix.platform == 'windows'
        with:
          name: NotepadNext-Windows-Qt${{ matrix.qt_version }}${{ matrix.artifact_suffix }}-Installer
          path: ${{ github.workspace }}/installer/NotepadNext*.exe

      - name: Upload MacOS dmg
        uses: actions/upload-artifact@v7
        if: matrix.platform == 'mac'
        with:
          name: NotepadNext-macOS-${{ matrix.arch }}-Qt${{ matrix.qt_version }}
          path: ${{ github.workspace }}/build/NotepadNext*.dmg

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v7
        if: matrix.platform == 'linux'
        with:
          name: NotepadNext-Linux-Qt${{ matrix.qt_version }}-AppImage
          path: ${{ github.workspace }}/build/NotepadNext*.AppImage

  github:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.repository == 'dail8859/NotepadNext' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      QT_ARM64_RELEASE_VER: 6.8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Create Draft Release
        run: |
          gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} --generate-notes --draft

      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Upload Windows Installer
        run: |
          gh release upload ${{ github.ref_name }} NotepadNext-Windows-Qt$QT_RELEASE_VER-Installer/NotepadNext-${{ github.ref_name }}-Installer.exe

      - name: Upload Windows Zip
        run: |
          cd NotepadNext-Windows-Qt$QT_RELEASE_VER-Zip/
          zip -r ../NotepadNext-${{ github.ref_name }}-win64.zip .
          cd ..
          gh release upload ${{ github.ref_name }} NotepadNext-${{ github.ref_name }}-win64.zip

      - name: Upload Windows arm64 Installer
        run: |
          mv NotepadNext-Windows-Qt$QT_ARM64_RELEASE_VER-arm64-Installer/NotepadNext-${{ github.ref_name }}-Installer.exe NotepadNext-${{ github.ref_name }}-Installer-arm64.exe
          gh release upload ${{ github.ref_name }} NotepadNext-${{ github.ref_name }}-Installer-arm64.exe

      - name: Upload Windows arm64 Zip
        run: |
          cd NotepadNext-Windows-Qt$QT_ARM64_RELEASE_VER-arm64-Zip/
          zip -r ../NotepadNext-${{ github.ref_name }}-win64-arm64.zip .
          cd ..
          gh release upload ${{ github.ref_name }} NotepadNext-${{ github.ref_name }}-win64-arm64.zip

      - name: Upload Linux AppImage
        run: |
          gh release upload ${{ github.ref_name }} NotepadNext-Linux-Qt$QT_RELEASE_VER-AppImage/NotepadNext-${{ github.ref_name }}-x86_64.AppImage

      - name: Upload macOS App (Intel x64)
        run: |
          gh release upload ${{ github.ref_name }} NotepadNext-macOS-x64-Qt${QT_RELEASE_VER}/NotepadNext-${{ github.ref_name }}.dmg

      - name: Upload macOS App (Apple Silicon arm64)
        run: |
          gh release upload ${{ github.ref_name }} NotepadNext-macOS-arm64-Qt${QT_RELEASE_VER}/NotepadNext-${{ github.ref_name }}.dmg
